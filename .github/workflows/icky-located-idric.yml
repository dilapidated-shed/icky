name: ICKY located parser through pinned Idriç

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

env:
  ASAN_OPTIONS: detect_leaks=0

jobs:
  located-parser:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - name: Checkout exact ICKY source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Checkout pinned source of canonical Idriç compiler
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: isomorphisms/Idric
          ref: 2734ac5a86610eddfab73b1644d72b4ac85a65ee
          path: .idric-host
          persist-credentials: false

      - name: Verify exact source identities
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha || github.sha }}"
          test "$(git -C .idric-host rev-parse HEAD)" = "2734ac5a86610eddfab73b1644d72b4ac85a65ee"
          git status --porcelain --untracked-files=no

      - name: Checkout independent package-material verifier
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: isomorphisms/ai-ci
          ref: afb04882771bc9f634968a6fdf0bc4120b10e3b5
          path: .aici-closure
          persist-credentials: false

      - name: Acquire pinned Grease implementation artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          artifact-ids: '11419782646'
          repository: dilapidated-shed/grease
          run-id: '37476471876'
          github-token: ${{ github.token }}
          path: .grease-runtime

      - name: Bind Grease implementation and generate its native applet adapter
        shell: bash
        run: |
          set -euo pipefail
          printf '%s\n' '7e31cd05b7a9d8fb2a4a9e003a7f3fcb0159138506d17f0fb28da8cbe22aa85c  .grease-runtime/_bin/cxx-asan/ysh' | sha256sum -c -
          chmod 755 .grease-runtime/_bin/cxx-asan/ysh
          printf '#!%s\n' "$GITHUB_WORKSPACE/.grease-runtime/_bin/cxx-asan/ysh" > .grease-runtime/grease
          cat packaging/grease-entrypoint.grease >> .grease-runtime/grease
          chmod 755 .grease-runtime/grease
          .grease-runtime/grease -c 'write -- pinned-grease-ready'

      - name: Install explicitly required Idriç bootstrap host tools
        shell: bash
        run: |
          set -euxo pipefail
          sudo apt-get update
          sudo apt-get install -y build-essential curl python3 util-linux

      - name: Build canonical pinned Idriç compiler through its own entrypoint
        shell: bash
        run: |
          set -euxo pipefail
          (
            cd .idric-host
            ./edric bootstrap
            ./edric test --only idris2/basic/edric001
            test -x build/exec/idris2
            build/exec/idris2 --version
          )
          printf '%s\n' "$GITHUB_WORKSPACE/.idric-host/.tools/bin" >> "$GITHUB_PATH"

      - name: Run exact-head ICKY tests with the actual built Idriç
        shell: bash
        env:
          IDRIC: ${{ github.workspace }}/.idric-host/build/exec/idris2
          IDRIC_SOURCE_SHA: 2734ac5a86610eddfab73b1644d72b4ac85a65ee
          IDRIC_PREFIX: ${{ github.workspace }}/.idric-host/_/build/env
        run: |
          set -euxo pipefail
          sh tests/qualify-located.sh
          cat "build/qualification/located-$(git rev-parse HEAD)/status.txt"

      - name: Package complete parser, runtime and source material
        shell: ${{ github.workspace }}/.grease-runtime/grease {0}
        run: |
          var root = ENV.GITHUB_WORKSPACE
          var revision = $(git -C $root rev-parse HEAD)
          $root/.grease-runtime/grease $root/packaging/package.grease $root $root/.idric-host $root/.grease-runtime/grease $root/.aici-closure $root/build/qualification/located-$revision

      - name: Retain source, toolchain, executable and test receipts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: icky-located-${{ github.event.pull_request.head.sha || github.sha }}-${{ github.run_id }}
          path: build/qualification/
          if-no-files-found: error
          retention-days: 14

  independent-evidence:
    name: Independent AICI receipt validation for located ICKY
    needs: located-parser
    runs-on: ubuntu-24.04
    steps:
      - name: Check out the same ICKY commit
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Download original ICKY executable and test receipts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: icky-located-${{ github.event.pull_request.head.sha || github.sha }}-${{ github.run_id }}
          path: evidence

      - name: Checkout pinned independent package verifier
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: isomorphisms/ai-ci
          ref: afb04882771bc9f634968a6fdf0bc4120b10e3b5
          path: .aici-closure
          persist-credentials: false

      - name: Acquire original pinned Grease harness
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          artifact-ids: '11419782646'
          repository: dilapidated-shed/grease
          run-id: '37476471876'
          github-token: ${{ github.token }}
          path: .grease-runtime

      - name: Verify Grease bytes and supply canonical native adapter
        shell: bash
        run: |
          set -euo pipefail
          printf '%s\n' '7e31cd05b7a9d8fb2a4a9e003a7f3fcb0159138506d17f0fb28da8cbe22aa85c  .grease-runtime/_bin/cxx-asan/ysh' | sha256sum -c -
          chmod 755 .grease-runtime/_bin/cxx-asan/ysh
          printf '#!%s\n' "$GITHUB_WORKSPACE/.grease-runtime/_bin/cxx-asan/ysh" > .grease-runtime/grease
          cat packaging/grease-entrypoint.grease >> .grease-runtime/grease
          chmod 755 .grease-runtime/grease
          .grease-runtime/grease -c 'write -- pinned-grease-ready'

      - name: Bind executable receipt to exact source and pinned Idriç
        shell: bash
        run: |
          set -euo pipefail
          source_sha="$(git rev-parse HEAD)"
          test "$source_sha" = '${{ github.event.pull_request.head.sha || github.sha }}'
          test -d "evidence/located-$source_sha"
          mv "evidence/located-$source_sha" evidence/receipt
          test "$(cat evidence/receipt/icky-source-sha.txt)" = "$source_sha"
          test "$(cat evidence/receipt/idric-source-sha-declared.txt)" = '2734ac5a86610eddfab73b1644d72b4ac85a65ee'
          grep -Fx 'Idris 2, version 0.8.0-2734ac5a8' evidence/receipt/idric-version.txt
          test "$(grep -c '^ok:' evidence/receipt/icky-tests.log)" -eq 77
          test "$(grep -c '^ok: tests/rejected/' evidence/receipt/type-refusals.log)" -eq 5
          test "$(wc -l < evidence/receipt/executables.sha256)" -eq 2
          (cd evidence/receipt && sha256sum -c executables.sha256)
          test -s evidence/receipt/idric-executable.sha256

      - name: Independently execute complete archived package from unrelated context
        shell: ${{ github.workspace }}/.grease-runtime/grease {0}
        run: |
          var root = ENV.GITHUB_WORKSPACE
          var revision = $(git -C $root rev-parse HEAD)
          var digest = $(cat $root/evidence/receipt/package.sha256).split(' ')[0]
          $root/.grease-runtime/grease $root/packaging/replay.grease $root $root/evidence/receipt/icky-native.tar.gz $digest $root/.aici-closure $root/.grease-runtime/grease $[ENV.RUNNER_TEMP]/icky-package-$revision

      - name: Retain independent execution and adversarial results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: icky-native-replay-${{ github.event.pull_request.head.sha || github.sha }}-${{ github.run_id }}
          path: ${{ runner.temp }}/icky-package-*
          if-no-files-found: error
          retention-days: 14

      - name: Independently evaluate the immutable acceptance contract
        uses: isomorphisms/ai-ci@b3af13b3ab2bac9dd7c72bf9dd855ed5a17609b5
        with:
          suite: .github/ai-ci/located-receipt.suite.tsv

      - name: Require AICI to reject a forged success receipt
        shell: bash
        run: |
          set -euo pipefail
          cp evidence/receipt/parser-protocol.log "$RUNNER_TEMP/parser-protocol-original.log"
          printf '%s\n' 'PROTOCOL CHECK SKIPPED' > evidence/receipt/parser-protocol.log
          if "$RUNNER_TEMP/aici" suite .github/ai-ci/located-receipt.suite.tsv . \
            > "$RUNNER_TEMP/aici-forged-receipt.log" 2>&1; then
            echo 'AICI accepted a forged ICKY protocol result' >&2
            exit 1
          fi
          grep -F 'ICKY-PROTOCOL-PASS' "$RUNNER_TEMP/aici-forged-receipt.log"
          cp "$RUNNER_TEMP/parser-protocol-original.log" evidence/receipt/parser-protocol.log
